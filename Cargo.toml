[package]
name = "gnosis-primitives"
version = "0.1.113-7b4c07"
edition = "2024"

[dependencies]
reth = { git = "https://github.com/paradigmxyz/reth", rev = "7b4c07338e098a3148bde43794f559df8ca1c314" }
reth-db = { git = "https://github.com/paradigmxyz/reth", rev = "7b4c07338e098a3148bde43794f559df8ca1c314" }
reth-codecs = { git = "https://github.com/paradigmxyz/reth", rev = "7b4c07338e098a3148bde43794f559df8ca1c314" }
reth-tracing = { git = "https://github.com/paradigmxyz/reth", rev = "7b4c07338e098a3148bde43794f559df8ca1c314" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", rev = "7b4c07338e098a3148bde43794f559df8ca1c314" }
reth-cli-commands = { git = "https://github.com/paradigmxyz/reth", rev = "7b4c07338e098a3148bde43794f559df8ca1c314" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth", rev = "7b4c07338e098a3148bde43794f559df8ca1c314" }

# Force specific vergen versions to avoid conflicts
# vergen = "=9.0.6"
# vergen-git2 = "=1.0.7"
# vergen-lib = "=0.1.6"

alloy-primitives = { version = "1.5.6", default-features = false }

alloy-consensus = { version = "1.7.3", default-features = false }
alloy-eips = { version = "1.7.3", default-features = false }
alloy-serde = { version = "1.7.3", default-features = false }

alloy-rlp = { version = "0.3.13", default-features = false }

serde = { version = "1.0", features = ["derive"], default-features = false }
derive_more = { version = "2", default-features = false, features = ["full"] }

alloy-trie = { version = "0.9.4", features = ["ethereum"] }
serde_with = "3"
test-fuzz = { version = "7" }
modular-bitfield = { version = "0.13.1" }

[dependencies.criterion]
version = "0.5"
features = ["html_reports"]
optional = true


[features]
default = []
bench = ["criterion"]

[[bench]]
name = "header_performance"
harness = false
required-features = ["bench"]
