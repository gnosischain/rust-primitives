[package]
name = "gnosis-primitives"
version = "0.2.10"
edition = "2024"

[dependencies]
reth = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097", default-features = false }
reth-db = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-tracing = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-cli-commands = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }

# Independent crates
reth-codecs = { version = "0.8.2", default-features = false }
reth-primitives-traits = { version = "0.8.2", default-features = false }

alloy-primitives = { version = "1.6.1", default-features = false }

alloy-consensus = { version = "2.5.0", default-features = false }
alloy-eips = { version = "2.5.0", default-features = false }
alloy-serde = { version = "2.5.0", default-features = false }

alloy-rpc-types = { version = "2.5.0", features = ["eth"], default-features = false }
alloy-rlp = { version = "0.3.16", default-features = false }

serde = { version = "1.0", features = ["derive"], default-features = false }
derive_more = { version = "2", default-features = false, features = ["full"] }

alloy-trie = { version = "0.9.8", features = ["ethereum"] }
serde_with = "3"
test-fuzz = { version = "7" }
modular-bitfield = { version = "0.13.1" }

[dependencies.criterion]
version = "0.5"
features = ["html_reports"]
optional = true


[features]
default = []
bench = ["criterion"]

[[bench]]
name = "header_performance"
harness = false
required-features = ["bench"]

# Mirror reth's own patches (patches don't propagate from git deps).
# Unifies evm2 revs between reth and reth-core; uses the pre-transfer URL since Cargo
# rejects a patch from the same source.
[patch."https://github.com/alloy-rs/evm2"]
evm2 = { git = "https://github.com/DaniPopes/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb" }
evm2-inspectors = { git = "https://github.com/DaniPopes/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb" }

# reth at this rev depends on unreleased reth-core.
[patch.crates-io]
reth-codecs = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-codecs-derive = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-rpc-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-zstd-compressors = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
